version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streamsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamsync
      POSTGRES_PASSWORD: streamsync123
      POSTGRES_DB: streamsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamsync"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

